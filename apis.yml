aid: document-crunch
name: Document Crunch
description: >-
  Document Crunch is an AI risk intelligence platform for the construction
  industry. Its construction-specific AI, CrunchAI, reads contracts, subcontracts,
  specifications, and project documents to surface risky clauses, obligations, and
  flow-downs with cited sources, and its Project Assist capability automates document
  reviews, drafts submittals and RFIs, and answers document-grounded questions across
  the project lifecycle from pursuit through closeout. The platform is used by general
  contractors, subcontractors, and specialty trades to track risk, align teams on
  standards, and act on contractual exposure. Headquartered in Alpharetta, Georgia,
  the company is backed by Fifth Wall. This API Evangelist profile is an enriched
  company lead; Document Crunch does not publish a public developer API, SDKs, or
  API documentation at this time.
